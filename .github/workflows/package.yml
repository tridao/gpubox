name: Build and check distributions

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Build and check metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test both installations
        env:
          CHECK_RELEASE: ${{ inputs.release }}
        run: |
          for artifact in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
            smoke=$(mktemp -d "$RUNNER_TEMP/gpubox-smoke.XXXXXX")
            python -m venv "$smoke"
            "$smoke/bin/python" -m pip install --no-deps "$artifact"
            (
              cd "$smoke"
              bin/gpubox --help
              bin/python -c 'import gpubox.api'
            )
            if [[ "$CHECK_RELEASE" == true && "$artifact" == *.whl ]]; then
              version=$("$smoke/bin/python" -c 'from importlib.metadata import version; print(version("gpubox"))')
              bash .github/scripts/check-release-tag.sh "$GITHUB_REF" "$version"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
