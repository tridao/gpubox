name: Publish gpubox

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        required: true
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      release: true

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: inputs.index == 'testpypi'
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: inputs.index == 'pypi'
