name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pre-commit==4.5.1
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # Install Miniflare before pytest so the client/Worker contract test runs.
      - uses: actions/setup-node@v6
        if: matrix.python == '3.x'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: store/package-lock.json
      - name: Test Worker against local D1
        if: matrix.python == '3.x'
        working-directory: store
        run: npm ci && npm test
      - run: python -m pytest -q -rs
      - name: Smoke-test installed wheel
        if: matrix.python == '3.x'
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          smoke/bin/gpubox --help
