name: Mutation tests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'  # Mondays, UTC

permissions:
  contents: read

jobs:
  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -u tests/mutations.py
