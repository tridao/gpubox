# `pre-commit install` sets up both hooks: ruff on each commit, and the message check.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: &python_files ^(src/gpubox|tests|scripts)/.*\.py$
      - id: ruff-format
        files: *python_files
  - repo: local
    hooks:
      - id: commit-message
        name: commit message (subject <= 72, blank line, body wrapped at 72)
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
